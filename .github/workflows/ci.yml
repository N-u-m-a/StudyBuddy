name: StudyBuddy CI/CD Pipeline

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t studybuddy-backend ./backend

      - name: Verify Docker image
        run: docker images studybuddy-backend